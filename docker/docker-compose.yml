# Miner Control - Docker Compose (generic Docker on Linux, run from this folder)
#   cd docker && cp .env.example .env && docker compose up -d
#
# Paths are relative to this file, so the whole project folder must stay together:
#   ../app    the program (read-only in the container)
#   ../data   settings, history, events (created automatically)
# Using CasaOS / Portainer's web editor? Use casaos/docker-compose.yml instead (absolute paths).
#
# OPTIONAL - HTTPS through Tailscale (needed to install the app on a phone and for push messages):
#   Set COMPOSE_PROFILES=tailscale and TS_AUTHKEY=<auth key> in .env, then "docker compose up -d".
services:
  minerdash:
    image: node:22-alpine
    container_name: minerdash
    restart: unless-stopped
    network_mode: host          # needed to reach the node RPC on 127.0.0.1:8332 (Linux only)
    working_dir: /app
    command: ["node", "server.js"]
    environment:
      - TZ=${TZ:-Europe/Berlin}
      - PORT=${MC_PORT:-18090}
      - CKPOOL_DIR=/ckpool
      - MC_LANG=${MC_LANG:-de}  # de or en (switchable in the page header)
    volumes:
      - ../app:/app:ro
      - ../data:/data
      - ${CKPOOL_HOST_DIR:-./no-ckpool}:/ckpool:ro   # ckpool.conf + logs, read-only (optional)

  tailscale:
    profiles: ["tailscale"]
    image: tailscale/tailscale:stable
    container_name: minerdash-tailscale
    restart: unless-stopped
    network_mode: host
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY:-}          # create one at https://login.tailscale.com/admin/settings/keys
      - TS_AUTH_ONCE=true
      - TS_HOSTNAME=${TS_HOSTNAME:-minerdash}
      - TS_USERSPACE=true
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/serve.json
    volumes:
      - ./tailscale/state:/var/lib/tailscale
      - ./tailscale/serve.json:/config/serve.json:ro
